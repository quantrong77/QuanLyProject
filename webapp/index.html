<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2e6b">
  <title>Tiến độ hiện trường</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="topProgress" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
      </div>
      <div>
        <select id="projSel" class="proj-sel" aria-label="Chọn dự án"><option>Đang tải…</option></select>
        <div class="brand-sub">Quản lý tiến độ &amp; nhật ký hiện trường</div>
      </div>
    </div>
    <div class="top-right" id="userBox" hidden>
      <span class="demo-pill" id="demoPill" hidden>DEMO</span>
      <button class="sync-btn" id="syncBtn" type="button" data-act="sync" aria-label="Đồng bộ dữ liệu từ Google Sheet" title="Đồng bộ dữ liệu từ Google Sheet">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 4V1L8 5l4 4V6a6 6 0 0 1 6 6c0 1-.25 1.97-.7 2.8l1.46 1.46A7.9 7.9 0 0 0 20 12a8 8 0 0 0-8-8m0 14a6 6 0 0 1-6-6c0-1 .25-1.97.7-2.8L5.24 7.74A7.9 7.9 0 0 0 4 12a8 8 0 0 0 8 8v3l4-4-4-4z"/></svg>
        <span id="syncTime"></span>
      </button>
      <button class="user-chip" id="userChip" type="button" aria-haspopup="menu">
        <img id="userAvatar" alt="" referrerpolicy="no-referrer">
        <span><b id="userName"></b><small id="userRole"></small></span>
      </button>
      <div class="menu" id="userMenu" role="menu" hidden>
        <div class="menu-head" id="menuEmail"></div>
        <div id="demoTools" hidden>
          <label>Xem thử với vai trò
            <select id="demoRole">
              <option value="admin">Quản trị</option>
              <option value="manager">Giám sát / BQLDA</option>
              <option value="contractor">Đơn vị thi công</option>
              <option value="viewer">Chỉ xem</option>
            </select>
          </label>
          <label>Đơn vị <select id="demoUnit"></select></label>
          <button type="button" class="btn ghost sm" data-act="demo-reset">Đặt lại dữ liệu demo</button>
        </div>
        <button type="button" class="btn ghost sm" data-act="profile">Thông tin cá nhân</button>
        <button type="button" class="btn ghost sm" data-act="logout">Đăng xuất</button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" hidden>
    <button data-view="dashboard" class="active"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm0 7h6v-5H4zm10 0h6v-9h-6zm0-16v5h6V4z"/></svg><span>Dashboard</span></button>
    <button data-view="field"><svg viewBox="0 0 24 24"><path d="M3 17.2V21h3.8l11-11-3.8-3.8zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.8 3.8z"/></svg><span>Cập nhật</span></button>
    <button data-view="gantt"><svg viewBox="0 0 24 24"><path d="M3 5h10v3H3zm4 5.5h10v3H7zM11 16h10v3H11z"/></svg><span>Tiến độ</span></button>
    <button data-view="log"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6zm8 1.5V8h4.5M8 12h8v1.6H8zm0 4h8v1.6H8z"/></svg><span>Nhật ký</span></button>
    <button data-view="admin" id="tabAdmin" hidden><svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5zm0 6a3 3 0 1 1 0 6 3 3 0 0 1 0-6m0 14c-2.5-.8-4.6-2.8-5.6-5.3C7.6 14.6 10 14 12 14s4.4.6 5.6 1.7c-1 2.5-3.1 4.5-5.6 5.3"/></svg><span>Quản trị</span><i class="badge" id="pendingBadge" hidden></i></button>
  </nav>

  <div id="netbar" class="netbar" role="status" hidden>Mất kết nối mạng – dữ liệu trên màn hình có thể chưa mới và cập nhật sẽ chưa gửi được.</div>

  <main id="main">
    <section class="boot" id="boot" aria-live="polite" aria-busy="true">
      <svg class="xf energize" viewBox="0 0 132 64" role="img" aria-label="Ký hiệu máy biến áp"><path class="bus" d="M2 32H38M94 32H130"/><path class="flow" d="M2 32H38M94 32H130"/><circle class="w w1" cx="54" cy="32" r="18"/><circle class="w w2" cx="78" cy="32" r="18"/></svg>
      <div class="boot-title">Tiến độ hiện trường</div>
      <ol class="boot-steps"><li data-step="connect" class="now">Kết nối máy chủ</li><li data-step="auth">Xác thực tài khoản Google</li><li data-step="data">Tải dữ liệu dự án</li></ol>
      <p class="boot-hint" id="bootHint"></p>
    </section>
  </main>

  <dialog id="dlg"><div id="dlgBody"></div></dialog>
  <dialog id="lightbox" class="lightbox"><img id="lightImg" alt="Ảnh hiện trường"><button class="btn" data-act="close-light">Đóng</button></dialog>
  <dialog id="confirmDlg" aria-label="Xác nhận"></dialog>
  <div id="toast" aria-live="polite"></div>
</body>
</html>
